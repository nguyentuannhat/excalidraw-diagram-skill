<text x="760" y="53.04" font-size="36" fill="#243b72" text-anchor="middle">Luồng xử lý yêu cầu</text>
<text x="260" y="130.03" font-size="27" fill="#243b72" text-anchor="middle">1. Tiếp nhận</text>
<text x="760" y="130.03" font-size="27" fill="#243b72" text-anchor="middle">2. Xét duyệt</text>
<text x="1260" y="130.03" font-size="27" fill="#243b72" text-anchor="middle">3. Thông báo</text>
<text x="260.0" y="194.3" font-size="20" fill="#174e7a" text-anchor="middle">Nhận yêu cầu</text>
<text x="260.0" y="307.8" font-size="20" fill="#9c5000" text-anchor="middle">Đủ thông tin?</text>
<rect x="263.8" y="352" width="52.400000000000006" height="20.0" rx="4" fill="white"/>
<text x="290" y="368.24" font-size="16" fill="#c92a2a" text-anchor="middle">Không</text>
<text x="260.0" y="424.3" font-size="20" fill="#9b2525" text-anchor="middle">Yêu cầu bổ sung</text>
<text x="260" y="478.24" font-size="16" fill="#243b72" text-anchor="middle">Đủ thông tin thì chuyển sang xét duyệt.</text>
<text x="760.0" y="194.3" font-size="20" fill="#174e7a" text-anchor="middle">Kiểm tra điều kiện duyệt</text>
<text x="760.0" y="307.8" font-size="20" fill="#9c5000" text-anchor="middle">Đáp ứng điều kiện?</text>
<rect x="763.8" y="352" width="52.400000000000006" height="20.0" rx="4" fill="white"/>
<text x="790" y="368.24" font-size="16" fill="#c92a2a" text-anchor="middle">Không</text>
<text x="760.0" y="424.3" font-size="20" fill="#9b2525" text-anchor="middle">Ghi lý do từ chối</text>
<text x="760" y="478.24" font-size="16" fill="#243b72" text-anchor="middle">Đạt điều kiện thì ghi nhận phê duyệt.</text>
<text x="1260.0" y="194.3" font-size="20" fill="#174e7a" text-anchor="middle">Gửi kết quả cho người yêu cầu</text>
<text x="1260.0" y="307.8" font-size="20" fill="#9c5000" text-anchor="middle">Được phê duyệt?</text>
<rect x="1167.52" y="349" width="26.96" height="20.0" rx="4" fill="white"/>
<text x="1181" y="365.24" font-size="16" fill="#2b8a3e" text-anchor="middle">Có</text>
<rect x="1316.8" y="349" width="52.400000000000006" height="20.0" rx="4" fill="white"/>
<text x="1343" y="365.24" font-size="16" fill="#c92a2a" text-anchor="middle">Không</text>
<text x="1155.0" y="423.505" font-size="17" fill="#226b30" text-anchor="middle">Báo phê duyệt</text>
<text x="1365.0" y="423.505" font-size="17" fill="#9b2525" text-anchor="middle">Gửi lý do từ chối</text>
</g></svg>
